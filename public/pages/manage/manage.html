<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>用户管理页面</title>
    <script src="../../../static/vue.js"></script>
    <link rel="stylesheet" href="../../../static/element-ui/element-ui.css">
    <script src="../../../static/element-ui/element-ui.js"></script>

</head>

<body>
    <div id="manage">
        <el-container>
            <!-- <el-header>用户管理</el-header> -->
            <el-main>
                <!-- height="500" width: 100%;  -->
                <el-table :data="tableData" border stripe style="margin-top: 20px">
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column v-for="(col, index) in columnArr" :key="index" :prop="col.prop" :label="col.label"
                        :width="col.width" align="center">
                    </el-table-column>
                    <el-table-column label="操作" width="395" align="center">
                        <template slot-scope="scope">
                            <el-button v-if="scope.row.role === '管理员'||userInfo.role === 'user'" size="mini"
                                type="danger" @click="editPwd(scope.row,true)">修改密码</el-button>

                            <template v-else>
                                <el-button v-if="scope.row.status === '禁用'" size="mini"
                                    @click="changeUserStatus(scope.row,true)">启用</el-button>
                                <el-button v-else size="mini" type="danger"
                                    @click="changeUserStatus(scope.row,false)">禁用</el-button>
                                <el-button size="mini" type="danger" @click="deleteUser(scope.row)">删除</el-button>
                                <el-button size="mini" type="danger" @click="editPwd(scope.row,false)">重置密码</el-button>
                            </template>
                        </template>
                    </el-table-column>
                </el-table>

                <div v-if="userInfo.role == 'Admin'" style="text-align: right; margin-top: 20px">
                    <el-button type="primary" @click="addUser">新增用户</el-button>
                </div>
            </el-main>
        </el-container>
    </div>

    <!-- 最后再加载 Vue 脚本 -->
    <script type="module" src="./public/pages/manage/manage.js"></script>
    <!-- <script src="./manage.js"></script> -->
</body>

</html>
