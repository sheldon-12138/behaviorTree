<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>用户管理页面</title>
    <script src="../../../static/vue.js"></script>
    <link rel="stylesheet" href="../../../static/element-ui/element-ui.css">
    <script src="../../../static/element-ui/element-ui.js"></script>

</head>

<body>
    <div id="manage">
        <el-container>
            <!-- <el-header>用户管理</el-header> -->
            <el-main>
                <!-- height="500" width: 100%;  -->
                <el-table :data="tableData" border stripe style="margin-top: 20px"
                    @selection-change="handleSelectionChange">
                    <el-table-column type="selection" width="60" align="center"></el-table-column>
                    <el-table-column prop="role" label="角色" width="180" align="center"></el-table-column>
                    <el-table-column prop="ip" label="Ip地址" width="180" align="center"></el-table-column>
                    <el-table-column prop="username" label="用户名" width="180" align="center"></el-table-column>
                    <el-table-column prop="password" label="密码" width="180" align="center"></el-table-column>
                    <el-table-column prop="tel" label="手机号码" width="240" align="center"></el-table-column>
                    <el-table-column prop="email" label="邮箱" width="240" align="center"></el-table-column>
                    <el-table-column prop="registerTime" label="注册时间" width="170" align="center"></el-table-column>
                    <el-table-column prop="status" label="用户状态" width="100" align="center"></el-table-column>
                    <el-table-column label="操作" width="320" align="center">
                        <template slot-scope="scope">
                            <el-button size="mini" @click="handleEdit(scope.$index, scope.row)">编辑</el-button>
                            <el-button size="mini" type="danger" :disabled="scope.row.role === '管理员'"
                                @click="handleDelete(scope.$index, scope.row)">禁用</el-button>
                            <el-button size="mini" type="danger" :disabled="scope.row.role === '管理员'"
                                @click="handleDelete(scope.$index, scope.row)">删除</el-button>
                            <el-button size="mini" type="danger"
                                @click="handleEdit(scope.$index, scope.row)">重置密码</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </el-main>
        </el-container>
    </div>

    <!-- 最后再加载 Vue 脚本 -->
    <script type="module" src="manage.js"></script>
    <!-- <script src="./manage.js"></script> -->
</body>

</html>
