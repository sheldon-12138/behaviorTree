<div style="display: flex;justify-content:space-between;align-items:center;">
    <div style="display: flex;">
        <div v-for="(item,index) in tabsArr" :key="item.id"
            :class="`tab ${statusData.currentTreeID==item.id?'activeTab':''}`" @click="clickTab(item.id)">
            <i v-if="statusData.isSplitScreen" class="el-icon-right" @click.stop="changeScreen(item.id,index)"></i>
            {{item.name}}
            <i class="el-icon-circle-close" @click.stop="closeTab(index)"></i>
        </div>
    </div>
    <div style="font-size: 30px;">
        <i v-if="statusData.isSplitScreen" @click="mergeScreen" class="el-icon-full-screen"></i>
        <i v-else @click="splitScreen" class="el-icon-c-scale-to-original"></i>
    </div>
</div>
